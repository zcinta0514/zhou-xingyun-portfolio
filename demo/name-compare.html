        mask-image:radial-gradient(ellipse 50% 54% at 50% 50%,#000 78%,transparent 100%)}
  .f-noto .nm{font-family:"Noto 600",serif;font-weight:600}
  .f-kr .nm{font-family:"Kai Regular",serif}
