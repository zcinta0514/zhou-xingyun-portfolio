<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机预览 · 周性运</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ddd9d0;color:#1a1917;font:14px/1.6 -apple-system,"PingFang SC",sans-serif}
header{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;padding:18px 16px}h1{font-size:14px;font-weight:500;margin:0 12px 0 0}
button,a{font:inherit;color:inherit}button{border:1px solid #b7b1a4;background:transparent;min-height:38px;padding:4px 12px;cursor:pointer}button[aria-pressed="true"]{background:#1a1917;color:#efede6;border-color:#1a1917}a{margin-left:8px;text-underline-offset:4px}
.device{--phone-width:390px;width:calc(var(--phone-width) + 2px);max-width:calc(100vw - 24px);margin:0 auto 20px;border:1px solid #777267;border-radius:22px;overflow:hidden;background:#efede6;box-shadow:0 12px 32px #1a191719}
iframe{display:block;border:0;width:100%;height:min(844px,calc(100dvh - 94px));min-height:440px;background:#efede6}
</style>
</head>
<body>
<header>
  <h1>手机预览</h1>
  <button type="button" data-width="320" aria-pressed="false">小屏</button>
  <button type="button" data-width="390" aria-pressed="true">标准</button>
  <button type="button" data-width="430" aria-pressed="false">大屏</button>
  <a href="../site/index.html" target="_blank" rel="noopener">桌面版 ↗</a>
</header>
<div class="device"><iframe src="../site/index.html?mobile-preview=20260927" title="个人网站手机版预览"></iframe></div>
<script>
document.querySelectorAll('[data-width]').forEach(function(button){
  button.addEventListener('click',function(){
    document.querySelector('.device').style.setProperty('--phone-width',button.dataset.width+'px');
    document.querySelectorAll('[data-width]').forEach(function(item){item.setAttribute('aria-pressed',String(item===button));});
  });
});
</script>
</body>
</html>
