<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="周性运个人作品集。内容策划与海外社媒运营。">
<title>周性运 · 个人作品集</title>
<!-- 令牌层与动效原语全部来自共享层，本页只写版式与叙事 -->
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#main">跳到正文</a>
<div class="grain" aria-hidden="true"></div>
<div class="sprog" aria-hidden="true"><i id="sprog-fill"></i></div>

<main id="main" tabindex="-1">

  <!-- ① 首屏：名字 + 一句定位 + 四个真实数字 + 两个行动入口 -->
  <header class="hero" id="home">
    <div class="wrap">
      <div class="hero-main">
        <div class="hero-copy">
          <h1 class="hero-name wipe"><span><b id="hero-name"></b> <em id="hero-en"></em></span></h1>
          <p class="hero-title" id="hero-title"></p>
          <p class="hero-line" id="hero-line"></p>
          <div class="hero-actions">
            <a class="btn" href="#peak">看作品</a>
            <a class="quiet" id="hero-resume">下载简历</a>
          </div>
        </div>
        <figure class="portrait">
          <img id="portrait-img" alt="" decoding="async" fetchpriority="high">
        </figure>
      </div>
      <ul class="proof" id="proof"></ul>
    </div>
  </header>

  <!-- ② 静默：峰值前一段几乎什么都没有的滚动，只有一行数据口径 -->
  <div class="silence" id="silence" aria-hidden="true">
    <p id="silence-line" data-reveal="fade"></p>
  </div>

  <!-- ③ 峰值：全站唯一的高潮。外层 .peak-trigger 不被裁切，负责观察；
        真正被 clip-path 裁切的 .peak 用 data-watch 指回它（clip-path 会让自身 IO 判定为 0 面积）。 -->
  <div class="peak-trigger" id="peak-trigger">
    <section class="peak" id="peak" aria-labelledby="peak-title" data-watch="#peak-trigger">
      <div class="wrap peak-inner">
        <div class="peak-top">
          <div class="peak-copy">
            <p class="peak-meta" id="peak-meta"></p>
            <h2 class="wipe" id="peak-title"><span id="peak-title-text"></span></h2>
            <p class="peak-number">
              <b class="num" id="peak-num">0</b><span class="peak-unit">播放</span>
            </p>
            <ul class="peak-stats" id="peak-stats"></ul>
            <ol class="peak-flow" id="peak-flow"></ol>
          </div>
          <figure class="peak-media" id="peak-media">
            <img id="peak-img" alt="" decoding="async" fetchpriority="high">
          </figure>
        </div>
        <div class="peak-foot">
          <p class="peak-why" id="peak-why" data-reveal="up"></p>
          <a class="peak-link" id="peak-link" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>
    </section>
  </div>

  <!-- ④ 经历：教育两张卡 + 三段实习，非对称网格 + 时间线，不用三列等宽卡片 -->
  <section class="section band" id="experience" aria-labelledby="exp-title">
    <div class="wrap">
      <h2 class="h2 wipe" id="exp-title"><span>履历</span></h2>
      <div class="exp-grid">
        <div class="edu-col" id="edu-col"></div>
        <ol class="timeline" id="exp-list"></ol>
      </div>
    </div>
  </section>

  <!-- ⑤ 能力：能力 ←→ 证据 联动，不是轨道图 -->
  <section class="section" id="capability" aria-labelledby="cap-title">
    <div class="wrap">
      <h2 class="h2 wipe" id="cap-title"><span>能力与证据</span></h2>
      <div class="cap-grid">
        <div class="cap-tabs" role="tablist" aria-orientation="vertical" aria-label="能力方向" id="cap-tabs"></div>
        <div class="cap-panels" id="cap-panels"></div>
      </div>
    </div>
  </section>

  <!-- ⑥ 更多作品：TikTok 其余 5 条 / Instagram 7 项 / 日韩教学 / 虎扑两篇 -->
  <section class="section" id="works" aria-labelledby="works-title">
    <div class="wrap">
      <h2 class="h2 wipe" id="works-title"><span>更多作品</span></h2>
      <p class="works-index" id="works-index"></p>

      <article class="unit" id="works-tiktok" aria-labelledby="tt-title">
        <header class="unit-head">
          <h3 class="h3 wipe" id="tt-title"><span></span></h3>
          <p class="unit-brief" id="tt-brief"></p>
          <ul class="tags" id="tt-scope"></ul>
        </header>
        <ol class="tt-list" id="tt-list" data-reveal="up"></ol>
        <p class="unit-note" id="tt-note"></p>
        <div class="duties" id="tt-duties"></div>
      </article>

      <article class="unit" id="works-instagram" aria-labelledby="ig-title">
        <header class="unit-head">
          <h3 class="h3 wipe" id="ig-title"><span></span></h3>
          <p class="unit-brief" id="ig-brief"></p>
          <ul class="tags" id="ig-tags"></ul>
        </header>
        <div class="ig-gallery">
          <div class="ig-stage">
            <figure class="ig-frame">
              <img id="ig-main-img" alt="" decoding="async" loading="lazy">
            </figure>
            <div class="ig-caption" id="ig-caption" aria-live="polite">
              <p class="ig-cat" id="ig-cat"></p>
              <h4 id="ig-work-title"></h4>
              <p class="ig-desc" id="ig-desc"></p>
              <dl class="ig-credit">
                <dt>我的工作</dt>
                <dd id="ig-role"></dd>
                <dt>署名</dt>
                <dd id="ig-credit-text"></dd>
              </dl>
              <ul class="ig-metrics" id="ig-metrics"></ul>
              <div class="ig-actions">
                <a class="unit-link" id="ig-link" target="_blank" rel="noopener noreferrer"></a>
                <div class="ig-steps" id="ig-steps"></div>
              </div>
            </div>
          </div>
          <div class="ig-thumbs" id="ig-thumbs" role="group" aria-label="Instagram 作品缩略图"></div>
        </div>
        <p class="unit-note" id="ig-note"></p>
      </article>

      <article class="unit" id="works-localization" aria-labelledby="loc-title">
        <header class="unit-head">
          <h3 class="h3 wipe" id="loc-title"><span></span></h3>
          <p class="unit-brief" id="loc-brief"></p>
          <p class="unit-count" id="loc-count"></p>
        </header>
        <div class="loc-grid">
          <figure class="loc-shot">
            <img id="loc-img" alt="" loading="lazy" decoding="async">
            <figcaption id="loc-caption"></figcaption>
          </figure>
          <ol class="loc-steps" id="loc-steps"></ol>
        </div>
        <p class="unit-credit" id="loc-credit"></p>
        <p class="unit-note" id="loc-note"></p>
        <a class="unit-link" id="loc-link" target="_blank" rel="noopener noreferrer"></a>
      </article>

      <article class="unit" id="works-hupu" aria-labelledby="hupu-title">
        <header class="unit-head">
          <h3 class="h3 wipe" id="hupu-title"><span></span></h3>
          <p class="unit-brief" id="hupu-brief"></p>
          <ul class="tags" id="hupu-tags"></ul>
        </header>
        <p class="hupu-role" id="hupu-role"></p>
        <ol class="hupu-list" id="hupu-list"></ol>
        <p class="unit-note" id="hupu-note"></p>
        <aside class="hupu-event" id="hupu-event"></aside>
      </article>
    </div>
  </section>

  <!-- ⑦ 账号实践：抖音「詹库侠」+ 开拍 RALLY -->
  <section class="section band" id="practice" aria-labelledby="practice-title">
    <div class="wrap">
      <h2 class="h2 wipe" id="practice-title"><span>账号实践</span></h2>
      <article class="douyin" id="douyin"></article>
      <article class="unit rally" id="practice-rally" aria-labelledby="rally-title">
        <header class="unit-head">
          <h3 class="h3 wipe" id="rally-title"><span id="rally-title-text"></span></h3>
          <p class="unit-brief" id="rally-intro"></p>
        </header>
        <figure class="rally-shot">
          <img id="rally-img" alt="" loading="lazy" decoding="async">
          <figcaption id="rally-caption"></figcaption>
        </figure>
        <ol class="rally-story" id="rally-story"></ol>
        <div class="rally-actions">
          <a class="btn" id="rally-play" target="_blank" rel="noopener noreferrer">开始试玩</a>
          <a class="quiet" id="rally-code" target="_blank" rel="noopener noreferrer">GitHub 源码</a>
        </div>
      </article>
    </div>
  </section>

  <!-- ⑧ 联系：邮箱做主角，收得干净 -->
  <section class="section contact" id="contact" aria-labelledby="contact-title">
    <div class="wrap">
      <h2 class="h1 wipe" id="contact-title"><span id="contact-heading"></span></h2>
      <p class="contact-lead" id="contact-lead"></p>
      <a class="contact-email" id="contact-email">
        <span class="contact-label">邮箱</span>
        <b id="contact-email-text"></b>
      </a>
      <div class="contact-row">
        <a class="contact-cell" id="contact-phone"><span class="contact-label">手机</span><b></b></a>
        <a class="contact-cell" id="contact-github" target="_blank" rel="noopener noreferrer"><span class="contact-label">GitHub</span><b></b></a>
        <a class="contact-cell" id="contact-resume"><span class="contact-label">简历</span><b></b><small></small></a>
      </div>
      <p class="contact-foot"><span id="contact-name"></span><span id="contact-cohort"></span></p>
    </div>
  </section>

</main>

<script src="../shared/content.js"></script>
<script src="../shared/motion.js"></script>
<script src="main.js"></script>
</body>
</html>
